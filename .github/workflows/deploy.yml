name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install critical CSS plugin
        run: pnpm add -D vite-plugin-critical-css

      - name: Run linter
        run: pnpm check
        continue-on-error: true

      - name: Build with optimizations
        run: pnpm run build
        env:
          VITE_CRITICAL_CSS_URL: https://velucedesign.com/
          VITE_CRITICAL_CSS_URLS: '{"/":"/","/article/upward-light":"/article/upward-light"}'
          VITE_MAILERLITE_API_KEY: ${{ secrets.VITE_MAILERLITE_API_KEY }}
          NODE_ENV: production

      - name: Generate sitemap and robots
        run: |
          echo "Sitemap and robots.txt generated during build"
          ls -lh dist/sitemap.xml dist/robots.txt || echo "Files not found"

      - name: Verify build output
        run: |
          echo "Build output size:"
          du -sh dist/
          echo ""
          echo "Asset breakdown:"
          find dist -type f -name "*.js" -o -name "*.css" -o -name "*.webp" -o -name "*.jpg" | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 Site URL: https://velucedesign.com"
