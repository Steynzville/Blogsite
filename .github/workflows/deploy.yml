name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Important for some generators

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm check
        continue-on-error: true

      - name: Build static site from Markdown
        run: pnpm run build
        env:
          VITE_CRITICAL_CSS_URL: https://velucedesign.com/
          VITE_CRITICAL_CSS_URLS: '{"/":"/","/article/upward-lighting-architectural-grazing":"/article/upward-lighting-architectural-grazing"}'
          VITE_MAILERLITE_API_KEY: ${{ secrets.VITE_MAILERLITE_API_KEY }}
          NODE_ENV: production

      - name: Verify Markdown processing
        run: |
          echo "=== Build Output Check ==="
          ls -la dist/ || echo "dist/ not found"
          echo ""
          echo "Checking for article HTML files:"
          find dist -name "*.html" | head -15
          echo ""
          echo "Checking upward lighting article:"
          ls -la dist/article/upward-lighting-architectural-grazing* 2>/dev/null || echo "Article folder not found"

      - name: Generate sitemap & robots.txt
        run: pnpm run generate-sitemap || echo "Sitemap script not found - skipping"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Live site: https://velucedesign.com"
          echo "⏱️  Check your article in 1-2 minutes"
