name: Veluce quality gates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm ops:audit
      - run: pnpm build
      - run: pnpm ops:validate
      - name: Capture desktop and mobile review pages
        run: |
          mkdir -p visual-review
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/veluce-preview.log 2>&1 &
          pnpm dlx playwright@1.56.1 install chromium
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,5000" --wait-for-selector=".ml-embedded input[type=email]" --wait-for-timeout=1500 http://127.0.0.1:8765/ visual-review/home-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,7000" --wait-for-selector=".ml-embedded input[type=email]" --wait-for-timeout=1500 http://127.0.0.1:8765/ visual-review/home-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,14000" --wait-for-selector="picture img" --wait-for-timeout=1500 'http://127.0.0.1:8765/article/upward-lighting-architectural-grazing/?utm_source=pinterest&utm_medium=organic_social' visual-review/article-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,14000" --wait-for-selector="picture img" --wait-for-timeout=1500 'http://127.0.0.1:8765/article/upward-lighting-architectural-grazing/?utm_source=pinterest&utm_medium=organic_social' visual-review/article-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,10000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/outdoor-lighting-blueprint/ visual-review/product-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,12000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/outdoor-lighting-blueprint/ visual-review/product-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,8000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/thank-you/outdoor-lighting-blueprint/ visual-review/thank-you-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,9000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/thank-you/outdoor-lighting-blueprint/ visual-review/thank-you-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,11000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/luxury-outdoor-room-planner/ visual-review/outdoor-room-product-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,13000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/luxury-outdoor-room-planner/ visual-review/outdoor-room-product-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,8000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/thank-you/luxury-outdoor-room-planner/ visual-review/outdoor-room-thank-you-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,9000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/thank-you/luxury-outdoor-room-planner/ visual-review/outdoor-room-thank-you-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,11500" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/designer-brief-builder/ visual-review/designer-brief-product-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,13500" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/designer-brief-builder/ visual-review/designer-brief-product-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,9000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/thank-you/designer-brief-builder/ visual-review/designer-brief-thank-you-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,10000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/thank-you/designer-brief-builder/ visual-review/designer-brief-thank-you-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,11500" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/luxury-lighting-formula/ visual-review/luxury-lighting-product-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,13500" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/luxury-lighting-formula/ visual-review/luxury-lighting-product-mobile.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="1440,9000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/thank-you/luxury-lighting-formula/ visual-review/luxury-lighting-thank-you-desktop.png
          pnpm dlx playwright@1.56.1 screenshot --full-page --viewport-size="390,10000" --wait-for-selector="h1" --wait-for-timeout=1000 http://127.0.0.1:8765/thank-you/luxury-lighting-formula/ visual-review/luxury-lighting-thank-you-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: veluce-visual-review
          path: visual-review/*.png
          retention-days: 7
