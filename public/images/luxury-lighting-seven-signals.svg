<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#f5efe4"/><text x="70" y="80" font-family="Georgia" font-size="50" fill="#17120f">The Seven Signals</text><circle cx="120" cy="280" r="54" fill="#17120f"/><text x="120" y="292" text-anchor="middle" font-family="Georgia" font-size="28" fill="#d6ae73">1</text><text x="120" y="370" text-anchor="middle" font-family="Arial" font-size="15" fill="#6c6257">Hierarchy</text><circle cx="275" cy="280" r="54" fill="#17120f"/><text x="275" y="292" text-anchor="middle" font-family="Georgia" font-size="28" fill="#d6ae73">2</text><text x="275" y="370" text-anchor="middle" font-family="Arial" font-size="15" fill="#6c6257">Layers</text><circle cx="430" cy="280" r="54" fill="#17120f"/><text x="430" y="292" text-anchor="middle" font-family="Georgia" font-size="28" fill="#d6ae73">3</text><text x="430" y="370" text-anchor="middle" font-family="Arial" font-size="15" fill="#6c6257">Direction</text><circle cx="585" cy="280" r="54" fill="#17120f"/><text x="585" y="292" text-anchor="middle" font-family="Georgia" font-size="28" fill="#d6ae73">4</text><text x="585" y="370" text-anchor="middle" font-family="Arial" font-size="15" fill="#6c6257">Warmth</text><circle cx="740" cy="280" r="54" fill="#17120f"/><text x="740" y="292" text-anchor="middle" font-family="Georgia" font-size="28" fill="#d6ae73">5</text><text x="740" y="370" text-anchor="middle" font-family="Arial" font-size="15" fill="#6c6257">Shadow</text><circle cx="895" cy="280" r="54" fill="#17120f"/><text x="895" y="292" text-anchor="middle" font-family="Georgia" font-size="28" fill="#d6ae73">6</text><text x="895" y="370" text-anchor="middle" font-family="Arial" font-size="15" fill="#6c6257">Concealment</text><circle cx="1050" cy="280" r="54" fill="#17120f"/><text x="1050" y="292" text-anchor="middle" font-family="Georgia" font-size="28" fill="#d6ae73">7</text><text x="1050" y="370" text-anchor="middle" font-family="Arial" font-size="15" fill="#6c6257">Scenes</text><path d="M80 500H1120" stroke="#b38a57" stroke-width="4"/><text x="70" y="600" font-family="Arial" font-size="23" fill="#17120f">Score the room. Fix the weakest signals first. Re-test from the same viewpoint.</text></svg>